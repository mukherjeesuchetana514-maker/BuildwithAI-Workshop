<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | MUKHERJEE FURNITURE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="antialiased bg-[#FAFAFA] flex flex-col min-h-screen">
        <!-- Navigation -->
    <nav class="fixed w-full z-50 glassmorphism transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center overflow-hidden">
                    <span class="font-bold text-lg sm:text-xl md:text-2xl tracking-widest uppercase truncate"><a href="/">MUKHERJEE FURNITURE</a></span>
                </div>
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="/#collections" class="text-gray-800 hover:text-black transition-colors duration-200 text-sm font-medium tracking-wide uppercase">Collections</a>
                    <a href="/about" class="text-gray-800 hover:text-black transition-colors duration-200 text-sm font-medium tracking-wide uppercase">About</a>
                    <a href="/contact" class="text-gray-800 hover:text-black transition-colors duration-200 text-sm font-medium tracking-wide uppercase">Contact Us</a>
                    <a href="/cart" class="text-gray-800 hover:text-black transition-colors duration-200 text-sm font-medium tracking-wide uppercase">Cart</a>
                </div>
                <!-- Mobile menu button -->
                <button id="mobile-menu-btn" class="block md:hidden text-gray-800 hover:text-black focus:outline-none">
                    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-[60] hidden transition-opacity duration-300 opacity-0"></div>
    
    <!-- Mobile Side Menu -->
    <div id="mobile-side-menu" class="fixed top-0 right-0 h-full w-64 bg-white shadow-2xl z-[70] transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-5 flex justify-end border-b border-gray-100">
            <button id="close-menu-btn" class="text-gray-800 hover:text-black focus:outline-none p-2 rounded-full hover:bg-gray-100 transition-colors">
                <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="px-4 py-6 space-y-2 flex-grow">
            <a href="/#collections" class="block px-4 py-3 rounded-xl text-base font-medium text-gray-800 hover:text-white hover:bg-black uppercase tracking-wide transition-colors duration-200">Collections</a>
            <a href="/about" class="block px-4 py-3 rounded-xl text-base font-medium text-gray-800 hover:text-white hover:bg-black uppercase tracking-wide transition-colors duration-200">About</a>
            <a href="/contact" class="block px-4 py-3 rounded-xl text-base font-medium text-gray-800 hover:text-white hover:bg-black uppercase tracking-wide transition-colors duration-200">Contact Us</a>
            <a href="/cart" class="block px-4 py-3 rounded-xl text-base font-medium text-gray-800 hover:text-white hover:bg-black uppercase tracking-wide transition-colors duration-200">Cart</a>
        </div>
        <div class="p-6 border-t border-gray-100">
            <p class="text-xs text-gray-500 uppercase tracking-widest text-center">Mukherjee Furniture</p>
        </div>
    </div>

    <main class="flex-grow pt-32 pb-12 px-4 sm:px-6 lg:px-8 max-w-3xl mx-auto w-full">
        <h1 class="text-3xl font-bold text-gray-900 mb-8 tracking-tight uppercase border-b border-gray-200 pb-4">Secure Checkout</h1>
        
        <form action="/checkout" method="POST" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 uppercase tracking-wide">Full Name</label>
                <input type="text" id="name" name="name" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-black focus:border-black sm:text-sm">
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 uppercase tracking-wide">Email ID</label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-black focus:border-black sm:text-sm">
            </div>
            
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700 uppercase tracking-wide">Shipping Address</label>
                <textarea id="address" name="address" rows="3" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-black focus:border-black sm:text-sm"></textarea>
            </div>
            
            <div class="pt-4 border-t border-gray-200">
                <h3 class="text-lg font-medium text-gray-900 uppercase tracking-wide mb-4">Payment Method</h3>
                <div class="space-y-4">
                    <div class="flex items-center">
                        <input id="credit-card" name="payment_method" type="radio" value="credit_card" checked class="focus:ring-black h-4 w-4 text-black border-gray-300">
                        <label for="credit-card" class="ml-3 block text-sm font-medium text-gray-700">Credit / Debit Card</label>
                    </div>
                    <div class="flex items-center">
                        <input id="paypal" name="payment_method" type="radio" value="paypal" class="focus:ring-black h-4 w-4 text-black border-gray-300">
                        <label for="paypal" class="ml-3 block text-sm font-medium text-gray-700">PayPal</label>
                    </div>
                    <div class="flex items-center">
                        <input id="cod" name="payment_method" type="radio" value="cod" class="focus:ring-black h-4 w-4 text-black border-gray-300">
                        <label for="cod" class="ml-3 block text-sm font-medium text-gray-700">Cash on Delivery</label>
                    </div>
                </div>
            </div>
            
            <div class="pt-6">
                <button type="submit" class="w-full bg-black text-white px-8 py-4 rounded-full font-medium hover:bg-gray-800 transition-colors duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 uppercase tracking-wide">Place Order</button>
            </div>
        </form>
    </main>

    <footer class="bg-black text-white py-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h3 class="text-2xl font-bold uppercase tracking-widest mb-4">MUKHERJEE FURNITURE</h3>
            <p class="text-xs text-gray-600">&copy; 2026 MUKHERJEE FURNITURE. All rights reserved.</p>
        </div>
    </footer>
    <!-- Script for Mobile Menu -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('mobile-menu-btn');
            const closeBtn = document.getElementById('close-menu-btn');
            const sideMenu = document.getElementById('mobile-side-menu');
            const overlay = document.getElementById('mobile-menu-overlay');

            function openMenu() {
                if(overlay && sideMenu) {
                    overlay.classList.remove('hidden');
                    void overlay.offsetWidth; // trigger reflow
                    overlay.classList.remove('opacity-0');
                    sideMenu.classList.remove('translate-x-full');
                }
            }

            function closeMenu() {
                if(overlay && sideMenu) {
                    overlay.classList.add('opacity-0');
                    sideMenu.classList.add('translate-x-full');
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                    }, 300);
                }
            }

            if (btn && closeBtn && sideMenu && overlay) {
                btn.addEventListener('click', openMenu);
                closeBtn.addEventListener('click', closeMenu);
                overlay.addEventListener('click', closeMenu);
            }
        });
    </script>
</body>
</html>
